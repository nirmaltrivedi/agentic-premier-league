<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cricket Recap</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

  <!-- ── Header ── -->
  <div class="header">
    <h1>Cricket Recap</h1>
    <span class="hint">Ask for a recap by name, or ask follow-up questions about the last match</span>
  </div>

  <!-- ── Message list ── -->
  <div id="messages"></div>

  <!-- ── Input bar ── -->
  <div class="input-bar">
    <div class="input-inner">
      <input type="text" id="msg" placeholder='e.g. "Show me Arjun&apos;s recap for India vs Pakistan"' />
      <button id="btn" onclick="send()">Send</button>
    </div>
  </div>

  <script src="/static/js/main.js"></script>
</body>
</html>
